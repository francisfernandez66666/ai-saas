<!DOCTYPE html>
<!-- AI-SCRM 统一登录页：企业码(可选)+账号密码；按角色跳转三端 -->
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · AI-SCRM</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:#f5f7fa;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#2d3748}
.card{background:#fff;border-radius:12px;padding:36px;box-shadow:0 4px 24px rgba(0,0,0,.08);width:min(420px,92vw)}
h2{margin-bottom:6px} .sub{color:#718096;font-size:13px;margin-bottom:22px}
label{display:block;font-size:13px;margin:14px 0 6px;color:#4a5568}
input,select{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px}
.btn{width:100%;margin-top:22px;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.btn:hover{opacity:.9} .tip{margin-top:16px;font-size:13px;text-align:center;color:#718096}
.tip a{color:#667eea} .msg{margin-top:14px;font-size:13px;min-height:18px}
.ok{color:#38a169}.err{color:#e53e3e}
</style>
<script>
let forceChangeToken='';
// 登录提交：成功后按角色分流；must_change_password=true 先进改密表单
async function doLogin(e){
  e.preventDefault();
  const body=Object.fromEntries(new FormData(e.target)), msg=document.getElementById('msg');
  msg.textContent='登录中...'; msg.className='msg';
  const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(j.code!==0){ msg.textContent=j.message||'登录失败'; msg.className='msg err'; return }
  /* 记录会话并按角色分流 */
  sessionStorage.setItem('token',j.data.token);
  localStorage.setItem('role',j.data.user.role);
  localStorage.setItem('username',j.data.user.username);
  /* M3 首登强改密：标记=true 时先改密再放行 */
  if(j.data.user.must_change_password){
    forceChangeToken=j.data.token;
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('changeGate').classList.remove('hidden');
    return;
  }
  const role=j.data.user.role;
  location.href = role==='super_admin' ? '/super_admin.html'
               : role==='tenant_admin'||role==='admin' ? '/admin.html' : '/advisor.html';
}
/* 首登强制改密提交 */
async function doForceChange(e){
  e.preventDefault();
  const f=e.target, msg=document.getElementById('chgMsg');
  const np=f.new_password.value, cp=f.confirm.value;
  msg.textContent='提交中...'; msg.className='msg';
  if(np!==cp){ msg.textContent='两次输入不一致'; msg.className='msg err'; return }
  const r=await fetch('/api/v1/auth/change-password',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+forceChangeToken},
    body:JSON.stringify({old_password:f.old_password.value,new_password:np})});
  const j=await r.json();
  if(j.code!==0){ msg.textContent=j.message||'修改失败'; msg.className='msg err'; return }
  msg.textContent='密码已更新，请重新登录'; msg.className='msg ok';
  setTimeout(()=>location.href='/login',800);
}
</script></head><body>
<div class="card">
<h2>登录工作台</h2><div class="sub">销售/管理员/平台超管统一入口</div>
<form id="loginForm" onsubmit="doLogin(event)">
<label>企业码（租户用户必填）</label><input name="tenant_code" placeholder="如 acme">
<label>用户名</label><input name="username" required>
<label>密码</label><input name="password" type="password" required>
<button class="btn" type="submit">登 录</button>
<div id="msg" class="msg"></div>
</form>
<!-- M3 首登强制改密表单（默认隐藏） -->
<form id="changeGate" class="hidden" onsubmit="doForceChange(event)">
<p style="background:#fef3c7;color:#92400e;padding:10px;border-radius:8px;font-size:13px;margin-bottom:6px">首次登录（或密码为出厂默认），请先设置新密码。要求：≥8位，含字母和数字。</p>
<label>当前密码</label><input name="old_password" type="password" required>
<label>新密码</label><input name="new_password" type="password" minlength="8" required>
<label>确认新密码</label><input name="confirm" type="password" minlength="8" required>
<button class="btn" type="submit">确认修改</button>
<div id="chgMsg" class="msg"></div>
</form>
<div class="tip">没有账号？<a href="/register">免费开通</a>　<a href="/">返回首页</a>　<a href="#" onclick="forgot()">忘记密码</a></div>
<!-- M3 忘记密码：随机码重置（log通道需注册手机号/邮箱校验） -->
<form id="resetGate" class="hidden" onsubmit="doResetRequest(event)">
<label>用户名</label><input name="username" required>
<label>注册手机号或邮箱</label><input name="contact">
<button class="btn" type="submit">发送验证码</button>
<div style="font-size:12px;color:#718096;margin-top:6px">验证码将输出到服务端日志（开发模式），10分钟内有效</div>
<div id="rstMsg" class="msg"></div>
</form>
<form id="resetConfirm" class="hidden" onsubmit="doResetConfirm(event)">
<input type="hidden" id="rstUser">
<label>验证码（查看服务端日志）</label><input name="code" required>
<label>新密码</label><input name="new_password" type="password" minlength="8" required>
<button class="btn" type="submit">重置密码</button>
<div id="rcMsg" class="msg"></div>
</form>
</div>
<script>
// 切换到忘记密码表单（重置码走服务端日志/SMTP）
function forgot(){
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('resetGate').classList.remove('hidden');
}
// 发送重置验证码：log通道需提供注册手机号/邮箱校验身份
async function doResetRequest(e){
  e.preventDefault();
  const f=e.target,msg=document.getElementById('rstMsg');
  msg.textContent='发送中...';msg.className='msg';
  const r=await fetch('/api/v1/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:f.username.value,contact:f.contact.value})});
  const j=await r.json();
  msg.textContent=j.message;msg.className='msg '+(j.code===0?'ok':'err');
  if(j.code===0){document.getElementById('rstUser').value=f.username.value;
    setTimeout(()=>{document.getElementById('resetGate').classList.add('hidden');
      document.getElementById('resetConfirm').classList.remove('hidden');},600);}
}
// 验证码+新密码提交重置（验证码一次性消费）
async function doResetConfirm(e){
  e.preventDefault();
  const f=e.target,msg=document.getElementById('rcMsg');
  msg.textContent='提交中...';msg.className='msg';
  const r=await fetch('/api/v1/auth/verify-reset-code',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:document.getElementById('rstUser').value,code:f.code.value,new_password:f.new_password.value})});
  const j=await r.json();
  msg.textContent=j.message;msg.className='msg '+(j.code===0?'ok':'err');
  if(j.code===0)setTimeout(()=>location.href='/login',900);
}
</script>
</body></html>

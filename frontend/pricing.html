<!DOCTYPE html>
<!-- AI-SCRM 套餐定价页：实时读取 subscription_plans 上架套餐 -->
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>套餐与定价 · AI-SCRM</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:#f5f7fa;padding:40px 20px;color:#2d3748}
h1{text-align:center;margin-bottom:8px}.sub{text-align:center;color:#718096;margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;max-width:1080px;margin:0 auto}
.plan{background:#fff;border-radius:12px;padding:26px;box-shadow:0 4px 18px rgba(0,0,0,.07);position:relative}
.plan.hot{border:2px solid #667eea}
.price{font-size:30px;font-weight:800;margin:10px 0}.price small{font-size:13px;color:#718096;font-weight:400}
ul{list-style:none;margin:14px 0}.li,.plan li{padding:5px 0;font-size:14px;color:#4a5568}
.plan li:before{content:"✓ ";color:#38a169}
.quota{font-size:12px;color:#718096;border-top:1px dashed #e2e8f0;margin-top:12px;padding-top:10px}
.buy{display:block;text-align:center;margin-top:16px;padding:11px;border-radius:8px;background:#667eea;color:#fff;text-decoration:none}
.back{text-align:center;margin-top:28px}.back a{color:#667eea}
</style></head><body>
<h1>选择适合您的套餐</h1><p class="sub">全部套餐支持免费试用 · 随时升降级</p>
<div class="grid" id="plans"></div>
<div class="back"><a href="/register">← 返回注册</a>　<a href="/">首页</a></div>
<script>
/* 渲染上架套餐卡片 */
fetch('/api/v1/plans').then(r=>r.json()).then(j=>{
  const box=document.getElementById('plans');
  (j.data||[]).forEach((p,i)=>{
    const m=(p.price_monthly_cents/100).toFixed(0);
    let hl=[],q=[];
    try{hl=JSON.parse(p.highlights||'[]')}catch(e){}
    box.insertAdjacentHTML('beforeend',`
      <div class="plan ${i===1?'hot':''}">
        ${i===1?'<span style="position:absolute;top:-10px;right:12px;background:#667eea;color:#fff;font-size:11px;padding:3px 8px;border-radius:10px">推荐</span>':''}
        <b>${p.name}</b>
        <div class="price">${m>0?'¥'+m:'<small>联系商务</small>'}${m>0?'<small>/月</small>':''}</div>
        <ul>${hl.map(h=>`<li>${h}</li>`).join('')}</ul>
        <div class="quota">席位 ${p.max_users} · 客户 ${p.max_customers} · 部门 ${p.max_departments}</div>
        <a class="buy" href="/register">${m>0?'免费试用':'联系我们'}</a>
      </div>`);
  });
});
</script></body></html>

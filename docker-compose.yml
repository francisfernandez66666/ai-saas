version: '3.8'

# AI-SCRM 本地开发环境（Phase M：多实例地基）
# 用法: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-scrm-pg
    environment:
      POSTGRES_USER: ai_scrm
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: ai_scrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-scrm-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

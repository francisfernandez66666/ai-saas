version: '3.8'

# AI-SCRM 本地开发环境（Phase M：多实例地基）
# 用法: docker compose up -d
services:
  postgres:
    # P1-补 pgvector：换用内置 vector 扩展的 PG 镜像，KB 向量检索走 SQL 索引。
    # 数据卷 pgdata 不变（沿用原库）；首次启动由 EnsurePgvector 执行 CREATE EXTENSION vector。
    image: ankane/pgvector:v0.8.0-pg16
    container_name: ai-scrm-pg
    environment:
      POSTGRES_USER: ai_scrm
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: ai_scrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-scrm-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

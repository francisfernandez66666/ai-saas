name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go 检查（vet+gofmt+单测+build）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:v0.8.0-pg16
        env:
          POSTGRES_USER: ai_scrm
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: ai_scrm
        ports:
          - 5432:5432
        # 健康检查：就绪后才跑测试（testutil 连真库跑 DB 依赖用例）
        options: >-
          --health-cmd "pg_isready -U ai_scrm -d ai_scrm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ai_scrm
      DB_PASSWORD: ci_pass
      DB_NAME: ai_scrm
      DB_SSLMODE: disable
      REDIS_ENABLED: "false"
      AI_MOCK_MODE: "true"
      GIN_MODE: release
      # E2E 断言脚本用 TEST_DB_URL 覆盖默认 dev 库连接（脚本默认连本地 ai_scrm:dev123）
      TEST_DB_URL: postgresql://ai_scrm:ci_pass@localhost:5432/ai_scrm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*' -not -path './frontend-react/*'))
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: 单测（含 DB 依赖用例，连 PG service）
        run: go test ./...
      - name: 编译
        run: go build -o ai-scrm ./cmd/server

  frontend:
    name: React 前端（vitest + 类型检查 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 单测（vitest）
        run: npm run test
      - name: 类型检查（tsc --noEmit）
        run: npx tsc --noEmit
      - name: 构建
        run: npm run build

  e2e:
    name: E2E 自动化回归（编排器 test_all --fast：smoke/org/saas 三套）
    runs-on: ubuntu-latest
    needs: [go, frontend]
    services:
      postgres:
        image: ankane/pgvector:v0.8.0-pg16
        env:
          POSTGRES_USER: ai_scrm
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: ai_scrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_scrm -d ai_scrm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ai_scrm
      DB_PASSWORD: ci_pass
      DB_NAME: ai_scrm
      DB_SSLMODE: disable
      REDIS_ENABLED: "false"
      AI_MOCK_MODE: "true"
      GIN_MODE: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: 前端依赖（编排器会跑 vitest + build）
        run: npm ci
        working-directory: frontend-react
      - name: 运行自动化测试编排器（单测+构建+三套E2E，lock 防并发）
        run: ./tools/test_all.sh --fast
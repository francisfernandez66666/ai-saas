name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go 检查（vet+gofmt+单测+build）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-trixie
        env:
          POSTGRES_USER: ai_scrm
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: ai_scrm
        ports:
          - 5432:5432
        # 健康检查：就绪后才跑测试（testutil 连真库跑 DB 依赖用例）
        options: >-
          --health-cmd "pg_isready -U ai_scrm -d ai_scrm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ai_scrm
      DB_PASSWORD: ci_pass
      DB_NAME: ai_scrm
      DB_SSLMODE: disable
      REDIS_ENABLED: "false"
      AI_MOCK_MODE: "true"
      GIN_MODE: release
      JWT_SECRET: "ci-test-secret-key-for-unit-tests-only-32ch"
      # E2E 断言脚本用 TEST_DB_URL 覆盖默认 dev 库连接（脚本默认连本地 ai_scrm:dev123）
      TEST_DB_URL: postgresql://ai_scrm:ci_pass@localhost:5432/ai_scrm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*' -not -path './frontend-react/*'))
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go mod download
        run: go mod download
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: govulncheck 官方漏洞库扫描（供应链安全，2026-09-15 增强批）
        # 首月观察模式：存量依赖命中 CVE 不阻断 CI，人工评估升级窗口后去掉本行
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: 单测（含 DB 依赖用例，连 PG service）
        run: go test ./...
      - name: 编译
        run: go build -o ai-scrm ./cmd/server

  prod-compose-smoke:
    name: 生产编排全新库冒烟（防 dev/CI 镜像漂移，P0-1）
    runs-on: ubuntu-latest
    # O2(2026-09-23 批六)：转阻断。此前 continue-on-error=true 掩盖的是一个真缺陷——
    # compose 用 .env 的 SERVER_PORT(模板值 9090) 当宿主发布端口、容器内却监听 8080，
    # 探测打 8080 故本 job 自合入起从未通过。端口口径已修（APP_PUBLISH_PORT），
    # 且判活改为"看容器 healthcheck 状态"（O1-b 已给 app 补 /health 探针），
    # 不再用"ps -q 有输出"（那只证明进程存在，不证明能应答）。
    steps:
      - uses: actions/checkout@v4
      - name: 生产编排全新库冒烟
        run: |
          cp .env.example .env
          # O2(2026-09-23 批六)：必须覆写 JWT_SECRET——.env.example 的占位值含 "change-me"，
          # 而 config.go 的弱密钥守卫在 release（本编排 GIN_MODE=release）下直接 log.Fatalf 拒启。
          # 这是 prod-compose-smoke 从未真正通过的第二个原因（第一个是宿主端口漂移）。
          # 仅 CI 冒烟用的一次性密钥，不构成生产密钥样板。
          echo 'JWT_SECRET=ci-prod-smoke-9f2c74ab1d8e46f0b3c5a7d2e91f4680' >> .env
          # keys/packs 为空挂载源：CI 检出里没有这两个目录，docker 会以 root 建空目录，
          # 显式 mkdir 免得读者误以为缺目录就是失败原因（缺私钥只影响解封，不影响起服）
          mkdir -p keys packs
          docker compose -f docker-compose.prod.yml up -d --build
          for i in $(seq 1 40); do
            st=$(docker compose -f docker-compose.prod.yml ps --format '{{.Service}} {{.State}} {{.Health}}' app | awk '{print $3}')
            if [ "$st" = "healthy" ] && curl -sf http://localhost:8080/health >/dev/null; then
              echo "prod-compose-smoke OK（healthcheck=healthy，/health 应答 200）"
              exit 0
            fi
            echo "[$i/40] app health=$st"
            sleep 5
          done
          docker compose -f docker-compose.prod.yml ps -a
          docker compose -f docker-compose.prod.yml logs --tail 150 app
          exit 1

  frontend:
    name: React 前端（vitest + 类型检查 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 单测（vitest）
        run: npm run test
      - name: 类型检查（tsc --noEmit）
        run: npx tsc --noEmit
      - name: Lint（ESLint 硬门：0 error，warning 锁基线不升）
        run: npm run lint:ci
      - name: 构建
        run: npm run build

  contract:
    name: T7 契约 codegen（golden+类型+FE路径+as-any基线）
    runs-on: ubuntu-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 契约检查
        run: ./tools/check_api_contract.sh

  e2e:
    name: E2E 自动化回归（八套 E2E + playwright（fast 跳过 uat））
    runs-on: ubuntu-latest
    needs: [go, frontend]
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-trixie
        env:
          POSTGRES_USER: ai_scrm
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: ai_scrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_scrm -d ai_scrm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ai_scrm
      DB_PASSWORD: ci_pass
      DB_NAME: ai_scrm
      DB_SSLMODE: disable
      REDIS_ENABLED: "false"
      AI_MOCK_MODE: "true"
      GIN_MODE: release
      JWT_SECRET: "ci-test-secret-key-for-unit-tests-only-32ch"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: 前端依赖（编排器会跑 vitest + build）
        run: npm ci
        working-directory: frontend-react
      - name: Playwright 浏览器（D3：真浏览器 E2E 接编排门禁）
        run: npx playwright install --with-deps chromium
        working-directory: frontend-react
      - name: 运行自动化测试编排器（单测+构建+E2E+浏览器回归，lock 防并发）
        run: ./tools/test_all.sh --fast

  uat:
    name: UAT 全场景回归（完整商业闭环，较长）
    runs-on: ubuntu-latest
    needs: [go, frontend]
    if: github.ref == 'refs/heads/main'
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-trixie
        env:
          POSTGRES_USER: ai_scrm
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: ai_scrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_scrm -d ai_scrm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ai_scrm
      DB_PASSWORD: ci_pass
      DB_NAME: ai_scrm
      DB_SSLMODE: disable
      REDIS_ENABLED: "false"
      AI_MOCK_MODE: "true"
      GIN_MODE: release
      JWT_SECRET: "ci-test-secret-key-for-unit-tests-only-32ch"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: 前端依赖
        run: npm ci
        working-directory: frontend-react
      - name: 运行全场景 UAT（含付费/邀请/三桶/注销）
        run: ./tools/test_all.sh --full
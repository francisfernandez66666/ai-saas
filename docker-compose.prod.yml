# ============================================================
# AI-SCRM 生产部署编排（P4 本地交付，2026-08-26）
#
# 用法：
#   1. 准备 .env（参考 .env.example，重点 DB_/REDIS_/SMTP_/JWT_SECRET/AI_MOCK_MODE）
#   2. 放置行业包到 ./packs/*.aipack（可选，启动后也可通过超管后台上传）
#   3. docker compose -f docker-compose.prod.yml up -d --build
#
# 注意：
#   - 生产必须显式设置 JWT_SECRET（未设置启动直接失败）与 AI_MOCK_MODE=false。
#   - **app 服务已挂 `env_file: .env`**（2026-09-23 D3/D4 批）：SMTP / TRUSTED_PROXIES / METRICS_TOKEN
#     这类"运行期直读进程环境"的键此前完全不进容器，且缺失时不报错。经 Nginx/网关部署时
#     `TRUSTED_PROXIES=<代理网段>` 必配，否则限流与登录防爆破按代理 IP 聚合。
#   - 图片/语音/微信 inbound 消息当前不支持（对话管线仅处理文本 MessageType:"text"），
#     未集成 OCR（tessdata 已移除）。
# ============================================================
services:
  postgres:
    # P0-1a(2026-09-22)：对齐 dev/CI 镜像，使用含 pgvector 的官方镜像，
    # 否则新库首启迁移 008 的 CREATE EXTENSION vector 会失败导致 crash-loop。
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ai_scrm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev123}
      POSTGRES_DB: ${DB_NAME:-ai_scrm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_scrm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    # O1-b(2026-09-23 批六)：redis 此前既无 healthcheck 也不在 app 依赖里——
    # app 抢在 redis 就绪前启动就吃 Ping 失败（旧实现一次定终身，永久跑成单机）。
    # 现补就绪探测 + 下方 depends_on service_healthy，把竞态从"靠运气"变成编排保证。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # ---- 生产环境变量透传（2026-09-23 D3/D4 批修的真缺口）----
    # 本服务此前只显式列 environment 那十几项，于是**所有"运行期直读进程环境"的键都进不了容器**：
    # SMTP_HOST/SMTP_USER/SMTP_PASS（internal/notify 到期邮件与催缴发不出去）、
    # TRUSTED_PROXIES（main.go:766 与 readiness 都直读，缺了经 Nginx 部署时限流/防爆破按代理 IP 聚合）、
    # METRICS_TOKEN（/metrics 鉴权）同样静默失效。三件事的共同点是**不报错**——服务照样起、照样 200。
    # 口径：`env_file` 提供全量键，上面/下面的显式 `environment` **优先级更高**（compose 合并规则），
    # 所以 SERVER_PORT/GIN_MODE/APP_ENV/AI_MOCK_MODE/JWT_SECRET/DB_*/REDIS_* 仍以编排声明为准，
    # 不会被宿主机 .env 反向改回 debug/mock 态。CI 的 prod-compose-smoke job 已 `cp .env.example .env`，
    # 故本项缺失即报错（fail-fast）而非静默少一批配置。
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      GIN_MODE: release
      # P1-4(2026-09-22)：显式声明生产环境，触发 main.go 启动断言
      # （APP_ENV=prod 且 GIN_MODE!=release 直接拒启）
      APP_ENV: prod
      # O1-b(2026-09-23)：副本数声明位——扩到多副本必须同步改这里，
      # 否则 main.go G6 告警与 /status 的"多实例但无 Redis"红灯都不会亮。
      # 默认 1（单实例安全），`APP_REPLICAS=3 docker compose ... up -d --scale app=3` 时必填。
      APP_REPLICAS: ${APP_REPLICAS:-1}
      # C2：生产必须显式关闭模拟模式，否则不会调用真实 AI
      AI_MOCK_MODE: "false"
      # P0-1 资金闸门（2026-09-23 D3/D4 批）：**故意写字面量而不是 ${ALLOW_MOCK_PAY:-false}**——
      # 上面刚引入 env_file，若这里仍做插值，宿主 .env 里残留的 ALLOW_MOCK_PAY=true（开发机复制过来的）
      # 就会把"模拟支付"带进生产容器；`${}` 插值本身也读项目目录 .env，等于把闸门交给了一个看不见的来源。
      # 现在生产编排出厂即关，真要做支付演练用 `docker compose -f docker-compose.prod.yml run --rm -e ALLOW_MOCK_PAY=true app`
      # 或显式改本行——**必须是看得见的动作，不能是 .env 的副作用**。
      ALLOW_MOCK_PAY: "false"
      # C1：生产必须配置强随机 JWT 密钥（未设置则启动直接失败）
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-ai_scrm}
      DB_PASSWORD: ${DB_PASSWORD:-dev123}
      DB_NAME: ${DB_NAME:-ai_scrm}
      REDIS_ENABLED: "true"
      REDIS_ADDR: redis:6379
      # ---- Token 计费与回流（平台下发后填入）----
      INDUSTRY_PACK_PRIV_KEY: /keys/pack_priv.pem
      INDUSTRY_PACK_PUB_KEY: /keys/pack_pub.pem
    volumes:
      - ./packs:/app/packs:ro        # 行业包目录（.aipack）
      - ./keys:/keys:ro              # 引擎侧密钥（验签公钥+解封私钥）
    # O1-b(2026-09-23)：宿主发布端口改用 APP_PUBLISH_PORT，不再复用 SERVER_PORT——
    # 旧写法读 .env 的 SERVER_PORT（模板值 9090）当宿主端口，容器内却固定监听 8080，
    # 于是"宿主端口"随 .env 漂移：CI prod-compose-smoke 按 8080 探测即永远探测不到，
    # 该 job 自合入起从未真正通过（被 continue-on-error 吞掉）。
    ports:
      - "${APP_PUBLISH_PORT:-8080}:8080"
    # O1-b：容器级就绪探针（/health 免鉴权、只读）——让 compose/orchestrator 与
    # CI prod-compose-smoke 判"服务真的能应答"，而不是判"进程还在"。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    # O1-b：资源上限（docker compose v2 的 `up` 即按 deploy.resources.limits 下发到容器；
    # swarm 部署同键复用）——
    # 防单实例 OOM 拖垮同宿主的 PG/Redis（三者同机是本编排的默认形态）
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-2}"
          memory: ${APP_MEM_LIMIT:-2g}

volumes:
  pgdata:
  redisdata:
